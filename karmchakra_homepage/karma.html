<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karma — KarmChakra</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Navbar (same as homepage) -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top kc-navbar kc-navbar--scrolled">
    <div class="container kc-container">
      <a class="navbar-brand kc-brand" href="index.html">
        <svg class="brand-symbol" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" stroke="currentColor" stroke-width="1"/>
          <circle cx="20" cy="20" r="12.5" stroke="currentColor" stroke-width="1"/>
          <path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.5 8.5l4.2 4.2M27.3 27.3l4.2 4.2M31.5 8.5l-4.2 4.2M12.7 27.3l-4.2 4.2" stroke="currentColor" stroke-width="1"/>
          <circle cx="20" cy="20" r="4" fill="currentColor"/>
        </svg>
        <span>KarmChakra</span>
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html#karmas">Karmas</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#profile">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#leaderboard">Leaderboard</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#guru">Karma Guru</a></li>
          <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
            <a class="btn kc-join-btn" href="index.html#join">Join</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Karma detail, populated by script.js from ?domain= -->
  <main class="karma-detail-section">
    <div class="container kc-container">
      <div class="karma-detail-card" data-karma-detail data-reveal></div>

      <div class="section-heading" data-reveal>
        <span class="section-kicker">MORE PATHS</span>
        <h2>Explore Other Karmas</h2>
      </div>

      <div class="karma-grid karma-grid--compact" data-karma-others data-reveal></div>
    </div>
  </main>

  <!-- Footer (same as homepage) -->
  <footer class="kc-footer">
    <div class="container text-center">
      <span class="footer-symbol">✺</span>
      <p class="footer-tagline">Every Good Action Creates Positive Change</p>
      <p class="footer-caption">KarmChakra · AI-powered karma recognition for a better Bharat</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
